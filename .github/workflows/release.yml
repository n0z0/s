name: Release and Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # --------------------------------------------------------------------------
  # 1. Automatic Tagging on Push to Main (if version in Cargo.toml not tagged)
  # --------------------------------------------------------------------------
  tag:
    name: Ensure Version Tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.check_tag.outputs.tag_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Version & Tag
        id: check_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "Triggered by tag: $TAG"
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep -m1 '^version' Cargo.toml | awk -F '"' '{print $2}')
            TAG="v$VERSION"
            echo "Cargo.toml version: $VERSION"
            
            # Check if tag already exists in remote
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists."
            else
              echo "Creating new tag $TAG..."
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG" -m "Release $TAG"
              git push origin "$TAG"
            fi
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          fi

  # --------------------------------------------------------------------------
  # 2. Build Release Binaries Matrix (Linux musl & macOS)
  # --------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    needs: tag
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross (for ARM64 cross-compilation)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package binary
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/s"
          ARCHIVE_NAME="s-${{ matrix.target }}.tar.gz"
          RAW_BIN_NAME="s-${{ matrix.target }}"

          # Create distribution directory
          mkdir -p dist
          cp "$BIN_PATH" dist/"$RAW_BIN_NAME"
          
          tar -czf dist/"$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" s
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: dist/*

  # --------------------------------------------------------------------------
  # 3. Publish GitHub Release
  # --------------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        shell: bash
        working-directory: release-assets
        run: |
          sha256sum s-* > checksums.txt
          cat checksums.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag_name }}
          name: Release ${{ needs.tag.outputs.tag_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false

  # --------------------------------------------------------------------------
  # 4. Deploy GitHub Pages (Website + One-liner install.sh)
  # --------------------------------------------------------------------------
  pages:
    name: Deploy GitHub Pages
    needs: [tag]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Pages directory
        run: |
          mkdir -p _site
          # Copy landing page and assets
          cp -r web/* _site/ 2>/dev/null || true
          # Make install.sh accessible directly via https://n0z0.if.co.id/s/install.sh
          cp install.sh _site/install.sh
          # Set custom domain CNAME for GitHub Pages
          echo "n0z0.if.co.id" > _site/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
