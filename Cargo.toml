[package]
name = "s"
version = "0.1.2"
edition = "2021"
description = "Super lightweight terminal session manager with file-backed buffer"
authors = ["joe"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
crossterm = "0.28"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term", "process", "signal", "fs", "ioctl", "poll"] }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
